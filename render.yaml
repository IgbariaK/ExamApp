services:
  - type: web
    name: exam-app-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_DATA_SOURCE
        value: postgres
      - key: PGSSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
